[package]
name = "commit-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal UI for writing and linting Conventional Commits"
license = "MIT"
repository = "https://github.com/mhinte/commit-tui"
keywords = ["git", "conventional-commits", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
conventional_commit_parser = "0.9"
gix = { version = "0.86", default-features = false, features = ["status", "dirwalk", "revision"] }
gix-hash = { version = "0.26", features = ["sha1"] }
indexmap = "2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
lto = "thin"
strip = true
