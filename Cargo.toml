[package]
name = "commit-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal UI for writing and linting Conventional Commits"
license = "MIT"
repository = "https://github.com/mhinte/commit-tui"
keywords = ["git", "conventional-commits", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"

[profile.release]
lto = "thin"
strip = true
