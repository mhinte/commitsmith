name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.1.0"
        required: true
      full:
        description: "Also build macOS and aarch64 (costs ~25 extra runner minutes)"
        type: boolean
        default: false

permissions:
  contents: write

# One release run per tag. A second push of the same tag must not cancel the
# jobs of the run that is already building.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing ships unless the same checks that guard main pass for this tag.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Work out the version once, so every target names its files identically.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

          # macOS runners bill at 10x and aarch64 is rarely used, so the default
          # release is the three targets that are actually installed. The full
          # set is one input away.
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            matrix='[
              {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"},
              {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-latest","linker":"aarch64-linux-gnu-gcc","packages":"gcc-aarch64-linux-gnu"},
              {"target":"x86_64-unknown-linux-musl","os":"ubuntu-latest","packages":"musl-tools"},
              {"target":"aarch64-unknown-linux-musl","os":"ubuntu-latest","musl_cross":true},
              {"target":"x86_64-apple-darwin","os":"macos-latest"},
              {"target":"aarch64-apple-darwin","os":"macos-latest"},
              {"target":"x86_64-pc-windows-msvc","os":"windows-latest"}
            ]'
          else
            matrix='[
              {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"},
              {"target":"x86_64-unknown-linux-musl","os":"ubuntu-latest","packages":"musl-tools"},
              {"target":"x86_64-pc-windows-msvc","os":"windows-latest"}
            ]'
          fi
          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "$matrix" | tr -d '\n' | sed 's/  */ /g' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  # One job per target, so a broken target does not hide the others. The target
  # list comes from the version job: three targets by default, all seven when the
  # `full` input asks for it.
  build:
    needs: [verify, version]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install cross packages
        if: matrix.packages && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Configure cross linker
        if: matrix.linker
        env:
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
        run: |
          set -euo pipefail
          mkdir -p .cargo
          printf '[target.%s]\nlinker = "%s"\n' "$TARGET" "$LINKER" >> .cargo/config.toml
          cat .cargo/config.toml

      # aarch64 musl has no distro cross gcc and musl.cc is not reliable from
      # hosted runners; this action ships a prebuilt musl toolchain.
      - name: Build (musl aarch64 via cross action)
        if: matrix.musl_cross
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked"

      - name: Build
        if: ${{ !matrix.musl_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Windows gets a zip (Expand-Archive in the installer) instead of tar.gz.
      - name: Package (Windows)
        id: pack_win
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $archive = "commitsmith-${env:VERSION}-${env:TARGET}"
          # Both directories are needed: GitHub-hosted Windows runners start
          # without dist/upload, unlike the shell step on Linux/macOS.
          New-Item -ItemType Directory -Path "dist/$archive" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist/upload" -Force | Out-Null
          Copy-Item "target/$($env:TARGET)/release/commitsmith.exe" "dist/$archive/commitsmith.exe"
          Copy-Item README.md, LICENSE "dist/$archive/"
          Compress-Archive -Path "dist/$archive/*" -DestinationPath "dist/upload/$archive.zip" -Force
          (Get-FileHash "dist/upload/$archive.zip" -Algorithm SHA256).Hash.ToLower() +
            "  $archive.zip" | Set-Content "dist/upload/$archive.zip.sha256" -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Package
        id: pack
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          archive="commitsmith-${VERSION}-${TARGET}"
          pkg="dist/${archive}"
          mkdir -p "$pkg" dist/upload
          cp "target/${TARGET}/release/commitsmith" "$pkg/commitsmith"
          cp README.md LICENSE "$pkg/"
          chmod +x "$pkg/commitsmith"
          stamp="$(date -u -r README.md +%Y%m%d%H%M.%S)"
          touch -t "$stamp" "$pkg" "$pkg"/*
          if [ "$RUNNER_OS" = "macOS" ]; then
            # BSD tar has no --sort/--owner; ditto sets the metadata explicitly.
            ditto -c -k --sequesterRsrc --keepParent "$pkg" "dist/upload/${archive}.tar.gz"
          else
            # Deterministic archive: same content, same bytes. The archive holds
            # the directory, so unpacking creates ${archive}/.
            tar --sort=name --owner=0 --group=0 --numeric-owner \
                --mtime="@$(date -u -r README.md +%s)" \
                -C dist -czf "dist/upload/${archive}.tar.gz" "${archive}"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist/upload && sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256")
          else
            (cd dist/upload && shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256")
          fi
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.archive || steps.pack_win.outputs.archive }}
          path: |
            dist/upload/*.tar.gz*
            dist/upload/*.zip*
          if-no-files-found: error
          retention-days: 7

  # Collect every archive and publish one release with a single checksum file.
  publish:
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          cat ./*.tar.gz.sha256 ./*.zip.sha256 | sort > SHA256SUMS
          cat SHA256SUMS
          # The published checksums must describe the published files.
          sha256sum -c SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          body: |
            Built by the release workflow from `${{ needs.version.outputs.tag }}`.
            Every target passed the same checks as `main`: formatting, clippy,
            unit tests, an end-to-end smoke test against a scratch repository,
            the commit-message lint and a dependency audit.

            Each `commitsmith-<version>-<target>.tar.gz` contains the binary,
            README and LICENSE. Verify with `sha256sum -c SHA256SUMS`.

            musl builds are static and run anywhere; gnu builds need a current
            glibc.
